name: Build Windows exe

on:
  push:
    branches: [claude/turnirum-tournament-platform-bq6cmd, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: >
          pyinstaller --onefile --name TurniRUM
          --add-data "turnirum/templates;turnirum/templates"
          --add-data "turnirum/static;turnirum/static"
          --add-data "turnirum/schema.sql;turnirum"
          launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: TurniRUM-windows
          path: dist/TurniRUM.exe
      - name: Commit exe to branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p release
          cp dist/TurniRUM.exe release/TurniRUM.exe
          git add -f release/TurniRUM.exe
          git commit -m "Build TurniRUM.exe [skip ci]" || exit 0
          git push
