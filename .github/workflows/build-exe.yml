name: Build Windows exe

on:
  push:
    branches: [claude/turnirum-tournament-platform-bq6cmd, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: >
          pyinstaller --onefile --name TurniRUM
          --add-data "turnirum/templates;turnirum/templates"
          --add-data "turnirum/static;turnirum/static"
          --add-data "turnirum/schema.sql;turnirum"
          launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: TurniRUM-windows
          path: dist/TurniRUM.exe
